<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>梦角</title>
<style>
:root{
  --bg:#ffffff;--card:#ffffff;--border:#efefef;--text:#111111;--sub:#a0a0a0;
  --soft:#f6f6f6;--radius:18px;--accent:#111111;
  --msg-them:#f6f6f6;--msg-me:#111111;--msg-me-text:#ffffff;
  --icon:#888888;
}
[data-theme="dark"]{
  --bg:#0d0d0d;--card:#191919;--border:#2a2a2a;--text:#f0f0f0;--sub:#7d7d7d;
  --soft:#232323;--accent:#f0f0f0;
  --msg-them:#232323;--msg-me:#f0f0f0;--msg-me-text:#0d0d0d;
  --icon:#777777;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:#f0f0f0;color:var(--text);
  display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;
}
#app{
  position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;
}
@media(min-width:480px){
  #app{height:min(880px,94vh);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.16);border:1px solid #e6e6e6}
}
.view{flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden}
.view.active{display:flex}
.pager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;scroll-snap-align:start;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:18px 16px 8px}
.page::-webkit-scrollbar{width:0}
.dots{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 0 12px}
.dot{width:7px;height:7px;border-radius:50%;background:#ddd;cursor:pointer;transition:all .28s cubic-bezier(.4,0,.2,1)}
[data-theme="dark"] .dot{background:#3a3a3a}
.dot.active{background:var(--accent);width:22px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-label{font-size:11.5px;color:var(--sub);margin-bottom:8px;letter-spacing:.4px}
.card-text{font-size:13.5px;line-height:1.6;color:var(--text)}
.card-text.placeholder{color:var(--sub)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.btn-black{border:0;border-radius:13px;background:var(--accent);color:var(--bg);
  font-size:13.5px;font-weight:600;font-family:inherit;padding:10px 18px;cursor:pointer;transition:opacity .15s}
.btn-black:active{opacity:.72}
.btn-black:disabled{opacity:.4;cursor:default}
.btn-line{border:1px solid var(--border);border-radius:13px;background:transparent;
  color:var(--text);font-size:13.5px;font-family:inherit;padding:10px 18px;cursor:pointer;transition:background .15s}
.btn-line:active{background:var(--soft)}
.couple{display:flex;align-items:flex-start;justify-content:center;gap:30px;padding:10px 0 6px}
.person{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer}
.person-av{width:72px;height:72px;border-radius:50%;overflow:hidden;
  background:var(--soft);display:flex;align-items:center;justify-content:center}
.person-av svg{display:block}
.person-name{font-size:12px;color:var(--sub)}
.couple-heart{padding-top:24px;color:#d4d4d4;display:flex;align-items:center}
[data-theme="dark"] .couple-heart{color:#3a3a3a}
.checkin{margin-top:14px;display:flex;align-items:center;gap:12px;padding:16px}
.checkin-main{flex:1;min-width:0}
.checkin-txt{font-size:13.5px;line-height:1.5}
.checkin-days{font-size:11.5px;color:var(--sub);margin-top:5px}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:16px}
.icon-cell{border:0;background:none;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:9px 2px;color:var(--text);border-radius:14px;transition:background .15s}
.icon-cell:active{background:var(--soft)}
.icon-box{width:50px;height:50px;border-radius:16px;background:var(--card);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--icon)}
.icon-label{font-size:11px;color:var(--sub);letter-spacing:.2px}
.player-top{display:flex;align-items:center;gap:13px}
.player-cover{width:54px;height:54px;border-radius:14px;background:var(--soft);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.player-meta{flex:1;min-width:0}
.player-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-sub{font-size:11.5px;color:var(--sub);margin-top:3px}
.player-bar{height:3px;background:var(--border);border-radius:2px;margin:16px 0 7px;overflow:hidden}
.player-bar-fill{height:100%;width:0;background:var(--accent);border-radius:2px}
.player-times{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub)}
.player-ctrl{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:14px}
.pc-btn{border:0;background:none;cursor:pointer;color:var(--icon);
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pc-btn:active{background:var(--soft)}
.pc-main{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--bg);
  display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
.pc-main:active{opacity:.75}
.big-card{padding:22px 18px;text-align:center;margin-top:16px;cursor:pointer;transition:background .15s}
.big-card:active{background:var(--soft)}
.big-card-title{font-size:15.5px;font-weight:600}
.big-card-line{width:26px;height:2px;background:var(--border);border-radius:2px;margin:12px auto}
.big-card-value{font-size:12.5px;color:var(--sub)}
.sub-header{flex:0 0 auto;height:54px;display:flex;align-items:center;
  padding:0 8px;gap:6px;padding-top:env(safe-area-inset-top);background:var(--bg)}
.sub-header h2{font-size:17px;font-weight:700;letter-spacing:-.3px;flex:1;min-width:0;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back-icon{border:0;background:none;cursor:pointer;width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;color:var(--icon);flex:0 0 auto}
.back-icon:active{background:var(--soft)}
.sub-actions{display:flex;align-items:center;gap:4px;flex:0 0 auto;min-width:38px;justify-content:flex-end}
.sub-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.sub-body::-webkit-scrollbar{width:0}
.scroll-full{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 24px;-webkit-overflow-scrolling:touch}
.scroll-full::-webkit-scrollbar{width:0}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.6px;padding:6px 0 18px}
.set-group{background:var(--card);border:1px solid var(--border);border-radius:16px;
  overflow:hidden;margin-bottom:14px}
.set-row{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;
  border-bottom:1px solid var(--border);transition:background .15s}
.set-row:last-child{border-bottom:0}
.set-row:active{background:var(--soft)}
.set-row.no-click{cursor:default}
.set-row.no-click:active{background:transparent}
.set-icon{width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.set-main{flex:1;min-width:0}
.set-title{font-size:14px}
.set-arrow{color:#c8c8c8;flex:0 0 auto;display:flex}
[data-theme="dark"] .set-arrow{color:#444}
.set-value{font-size:12.5px;color:var(--sub);flex:0 0 auto;margin-right:4px}
.switch{width:44px;height:26px;border-radius:14px;background:#d8d8d8;position:relative;
  flex:0 0 auto;border:0;cursor:pointer;transition:background .2s}
[data-theme="dark"] .switch{background:#3a3a3a}
.switch.on{background:var(--accent)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on::after{transform:translateX(18px)}
[data-theme="dark"] .switch.on::after{background:#111}
.inp{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);
  border-radius:12px;padding:12px 13px;font-size:13.5px;font-family:inherit;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.ta{min-height:88px;resize:vertical;line-height:1.6}
.empty{text-align:center;color:var(--sub);font-size:12.5px;padding:40px 16px;line-height:2}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-month{font-size:16.5px;font-weight:700}
.cal-nav{display:flex;gap:2px}
.cal-nav button{border:0;background:none;cursor:pointer;width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:var(--icon);font-size:18px}
.cal-nav button:active{background:var(--soft)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-week span{text-align:center;font-size:11px;color:var(--sub);padding:6px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;
  border-radius:50%;cursor:pointer;color:var(--text);position:relative;transition:background .15s}
.cal-day:active{background:var(--soft)}
.cal-day.other{color:var(--sub);opacity:.3}
.cal-day.today{font-weight:700}
.cal-day.today::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cal-day.marked{background:var(--accent);color:var(--bg)}
.letter-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:15px 16px;margin-bottom:10px;cursor:pointer;position:relative;transition:background .15s}
.letter-card:active{background:var(--soft)}
.letter-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.letter-from{font-size:11.5px;color:var(--sub)}
.letter-title{font-size:14px;font-weight:600;margin-bottom:5px}
.letter-preview{font-size:12.5px;color:var(--sub);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.letter-dot{position:absolute;top:15px;right:15px;width:7px;height:7px;border-radius:50%;background:#ff3b30}
.letter-paper{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:22px;line-height:2;font-size:14px;white-space:pre-wrap;word-break:break-word}
.letter-paper-title{font-size:17px;font-weight:700;margin-bottom:16px}
.letter-meta{font-size:11.5px;color:var(--sub);text-align:right;margin-top:20px;line-height:1.9}
.moment-bg{height:140px;border-radius:16px;display:flex;align-items:flex-end;padding:14px;
  margin-bottom:16px;position:relative;background-size:cover;background-position:center;background-color:#dbeafe}
.moment-me{display:flex;align-items:center;gap:10px;color:#111;text-shadow:0 1px 3px rgba(255,255,255,.7)}
.moment-av{width:42px;height:42px;border-radius:12px;overflow:hidden;background:#fff;
  border:2px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.moment-name{font-size:14px;font-weight:600}
.moment-item{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.moment-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.moment-head-av{width:36px;height:36px;border-radius:11px;overflow:hidden;
  background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.moment-author{font-size:13px;font-weight:600}
.moment-time{font-size:11px;color:var(--sub);margin-top:2px}
.moment-text{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.moment-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}
.moment-imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.moment-actions{display:flex;gap:14px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--border);font-size:12.5px;color:var(--sub)}
.moment-act{display:flex;align-items:center;gap:5px;cursor:pointer;background:none;
  border:0;font-family:inherit;color:var(--sub);font-size:12.5px;padding:0}
.moment-act.liked{color:#ff3b30}
.moment-comments{margin-top:10px;background:var(--soft);border-radius:10px;padding:10px 12px}
.moment-comment{font-size:12.5px;line-height:1.6;padding:3px 0}
.moment-comment b{color:var(--text);font-weight:600}
.visitor-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);
  border:1px solid var(--border);border-radius:14px;margin-bottom:8px;cursor:pointer;
  transition:background .15s;user-select:none}
.visitor-item:active{background:var(--soft)}
.visitor-name{font-size:13.5px;flex:1}
.visitor-time{font-size:11.5px;color:var(--sub)}
.div-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.div-choice{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:20px 12px;text-align:center;cursor:pointer;font-family:inherit;color:var(--text);transition:all .2s}
.div-choice:active{background:var(--soft)}
.div-choice.sel{border-color:var(--accent);background:var(--soft)}
.div-emoji{font-size:28px;margin-bottom:8px;line-height:1}
.div-name{font-size:13.5px;font-weight:600}
.div-sub{font-size:11px;color:var(--sub);margin-top:4px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--border);border-radius:11px;background:var(--card);
  color:var(--text);font-size:12.5px;padding:8px 15px;cursor:pointer;font-family:inherit;transition:all .15s}
.chip:active{background:var(--soft)}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.div-result{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:10px;text-align:center}
.div-result-name{font-size:15px;font-weight:600;margin-bottom:6px}
.div-result-desc{font-size:12px;color:var(--sub);line-height:1.7}
.reversed{color:#ff6b6b}
.upright{color:#4ade80}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--soft);border-radius:12px;padding:4px}
.tab{flex:1;border:0;background:none;cursor:pointer;padding:9px;border-radius:9px;
  font-size:12.5px;font-family:inherit;color:var(--sub);transition:all .2s}
.tab.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.fav-item{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:13px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;
  cursor:pointer;transition:all .15s}
.fav-item:active{background:var(--soft)}
.fav-item.sel{border-color:var(--accent);background:var(--soft)}
.fav-check{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--border);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  margin-top:1px;transition:all .15s;font-size:11px;color:transparent}
.fav-check.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.fav-text{flex:1;font-size:13px;line-height:1.6;word-break:break-word}
.fav-time{font-size:10.5px;color:var(--sub);margin-top:4px}
.music-item{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.music-cover{width:40px;height:40px;border-radius:11px;background:var(--soft);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.music-info{flex:1;min-width:0}
.music-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-src{font-size:11px;color:var(--sub);margin-top:3px}
.music-act{display:flex;gap:6px;flex:0 0 auto}
.mini-btn{border:1px solid var(--border);background:var(--card);color:var(--text);
  border-radius:9px;font-size:12px;padding:6px 11px;cursor:pointer;font-family:inherit;transition:background .15s;flex:0 0 auto}
.mini-btn:active{background:var(--soft)}
.mini-btn.danger{color:#ff3b30;border-color:#ff3b3033}
.q-item{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:13px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px}
.q-idx{font-size:11px;color:var(--sub);width:18px;flex:0 0 auto;padding-top:3px}
.q-text{flex:1;font-size:13px;line-height:1.6;word-break:break-word}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:18px;margin-bottom:12px}
.stat-title{font-size:12px;color:var(--sub);margin-bottom:12px}
.top-word{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px}
.top-word .rank{font-size:11px;font-weight:700;color:var(--sub);background:var(--soft);
  border-radius:6px;padding:3px 7px;flex:0 0 auto}
.top-word .word{flex:1;font-weight:500}
.top-word .count{font-size:11.5px;color:var(--sub)}
.water-cup{width:130px;height:170px;margin:24px auto;border:2px solid var(--border);
  border-radius:12px 12px 20px 20px;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.water-fill{width:100%;background:linear-gradient(180deg,#bfdbfe,#60a5fa);
  transition:height .5s cubic-bezier(.4,0,.2,1)}
.water-btn{display:block;margin:0 auto;border:0;border-radius:14px;background:var(--accent);
  color:var(--bg);font-size:14.5px;font-weight:600;font-family:inherit;padding:14px 34px;cursor:pointer}
.water-btn:active{opacity:.75}
.chat-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px;
  display:flex;flex-direction:column;gap:13px;-webkit-overflow-scrolling:touch}
.chat-body::-webkit-scrollbar{width:0}
.msg{display:flex;gap:9px;align-items:flex-start;max-width:100%}
.msg.mine{flex-direction:row-reverse}
.msg-av{flex:0 0 auto;overflow:hidden;background:var(--soft);
  display:flex;align-items:center;justify-content:center}
.msg-bubble{max-width:70%;padding:10px 13px;border-radius:15px;font-size:13.5px;
  line-height:1.55;word-break:break-word;position:relative;cursor:pointer;user-select:none}
.msg.them .msg-bubble{background:var(--msg-them);color:var(--text);border-top-left-radius:5px}
.msg.mine .msg-bubble{background:var(--msg-me);color:var(--msg-me-text);border-top-right-radius:5px}
.msg-time{text-align:center;font-size:11px;color:var(--sub);margin:3px 0}
.msg-sys{text-align:center;font-size:11.5px;color:var(--sub);padding:2px 0}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--sub);padding:40px 20px}
.chat-empty svg{color:#d4d4d4}
[data-theme="dark"] .chat-empty svg{color:#2a2a2a}
.chat-empty-text{font-size:13px}
.chatlist-header{flex:0 0 auto;height:56px;display:flex;align-items:center;
  padding:0 8px;padding-top:env(safe-area-inset-top);gap:6px;background:var(--bg)}
.chatlist-header h2{font-size:17px;font-weight:700;flex:1;text-align:center;letter-spacing:-.3px}
.chatlist-body{flex:1;overflow-y:auto;padding:4px 8px 24px;-webkit-overflow-scrolling:touch}
.chatlist-body::-webkit-scrollbar{width:0}
.chatlist-item{display:flex;align-items:center;gap:12px;padding:12px 10px;
  border-radius:14px;cursor:pointer;transition:background .15s}
.chatlist-item:active{background:var(--soft)}
.chatlist-av{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--soft);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.chatlist-main{flex:1;min-width:0}
.chatlist-name{font-size:14.5px;font-weight:500}
.chatlist-last{font-size:12px;color:var(--sub);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatlist-time{font-size:11px;color:var(--sub);flex:0 0 auto;align-self:flex-start;margin-top:5px}
.chat-topbar{flex:0 0 auto;height:56px;display:flex;align-items:center;
  padding:0 8px;padding-top:env(safe-area-inset-top);gap:6px;
  border-bottom:1px solid var(--border);background:var(--bg)}
.chat-top-profile{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}
.chat-top-av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--soft);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.chat-top-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-top-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.chat-input-bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--bg)}
.chat-input-bar input{flex:1;min-height:38px;border:1px solid var(--border);
  background:var(--soft);color:var(--text);border-radius:12px;padding:0 13px;
  font-size:13.5px;font-family:inherit;outline:none}
.chat-input-bar input:focus{border-color:var(--accent)}
.cb-btn{border:0;background:none;cursor:pointer;color:var(--icon);
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cb-btn:active{background:var(--soft)}
.panel{
  position:absolute;left:0;right:0;bottom:0;background:var(--card);
  border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  z-index:110;transform:translateY(110%);transition:transform .25s ease;
  max-height:60%;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2);
  border-top:1px solid var(--border);
}
.panel.open{transform:translateY(0)}
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:105;display:none}
.sheet-mask.open{display:block}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sticker-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--bg);cursor:pointer;display:block}
.sticker-tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--soft);border-radius:12px;padding:4px}
.sticker-tab{flex:1;border:0;background:none;cursor:pointer;padding:8px;border-radius:9px;
  font-size:12.5px;font-family:inherit;color:var(--sub)}
.sticker-tab.on{background:var(--card);color:var(--text);font-weight:600}
.sticker-wrap{position:relative}
.sticker-del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;border:0;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.plus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.plus-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  font-size:11.5px;color:var(--sub);background:none;border:0;font-family:inherit;padding:0}
.plus-icon{width:56px;height:56px;border-radius:16px;background:var(--soft);
  display:flex;align-items:center;justify-content:center;color:var(--icon)}
.msg-menu{position:absolute;z-index:400;background:var(--card);border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.2);overflow:hidden;min-width:130px;border:1px solid var(--border)}
.msg-menu button{display:block;width:100%;border:0;background:none;padding:12px 20px;
  font-size:14px;font-family:inherit;color:var(--text);text-align:center;cursor:pointer}
.msg-menu button:active{background:var(--soft)}
.msg-menu button.danger{color:#ff3b30}
.call-overlay{position:absolute;inset:0;z-index:500;background:linear-gradient(160deg,#1a1a1a,#0a0a0a);
  display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:16px}
.call-overlay.on{display:flex}
.call-av{width:100px;height:100px;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;background:#333}
.call-name{font-size:20px;font-weight:600}
.call-status{font-size:14px;color:rgba(255,255,255,.6);letter-spacing:.5px}
.call-actions{display:flex;gap:50px;margin-top:40px}
.call-btn{width:64px;height:64px;border-radius:50%;border:0;color:#fff;
  font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.call-btn.hang{background:#fa5151}
.call-btn.answer{background:#07c160}
.info-av{width:56px;height:56px;border-radius:14px;overflow:hidden;background:var(--soft);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.avatarsvg{display:block}
#toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,12px);
  background:rgba(0,0,0,.85);color:#fff;font-size:12.5px;padding:10px 18px;
  border-radius:22px;opacity:0;transition:.25s;pointer-events:none;z-index:600;
  max-width:82%;text-align:center;line-height:1.5}
#toast.on{opacity:1;transform:translate(-50%,0)}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px)}
.overlay.hidden{display:none}
.modal{background:var(--card);color:var(--text);border-radius:22px;padding:24px;
  width:100%;max-width:330px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:80vh;overflow-y:auto}
.modal h3{margin:0 0 12px;font-size:16px;text-align:center;font-weight:700}
.modal p{font-size:13px;line-height:1.8;color:var(--sub);margin:8px 0}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-btns button{flex:1;margin-top:0}
.tut-dots{display:flex;gap:6px;justify-content:center;margin-top:18px}
.tut-dots i{width:6px;height:6px;border-radius:50%;background:var(--border);transition:.2s}
.tut-dots i.on{background:var(--accent);width:18px;border-radius:3px}
.tut-emoji{font-size:42px;text-align:center;margin-bottom:10px;line-height:1}
.mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0}
.mood-btn{border:1px solid var(--border);background:var(--card);border-radius:12px;
  padding:12px 0;font-size:23px;cursor:pointer}
.mood-btn:active{background:var(--soft)}
.color-row{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.color-dot{width:40px;height:40px;border-radius:12px;border:2px solid var(--border);cursor:pointer}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.tip{background:var(--soft);border-radius:12px;padding:11px 14px;font-size:11.5px;
  color:var(--sub);line-height:1.75;margin-top:14px}
#netBar{position:absolute;top:0;left:0;right:0;z-index:550;background:#111;color:#fff;
  font-size:12.5px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:none;align-items:center;justify-content:center;gap:10px}
#netBar.on{display:flex}
#netBar button{background:rgba(255,255,255,.2);border:0;color:#fff;
  padding:4px 12px;border-radius:14px;font-size:11.5px;cursor:pointer}

/* 悬浮面板 */
.sheet-wrap{
  position:absolute;inset:0;z-index:600;
  display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(0,0,0,.45);backdrop-filter:blur(3px);
}
.sheet-wrap.hidden{display:none}
.sheet-panel{
  background:var(--card);color:var(--text);
  border-radius:20px;width:100%;max-width:400px;
  max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;
  border:1px solid var(--border);
}
.sheet-panel .sp-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid var(--border);
}
.sheet-panel .sp-title{font-size:16px;font-weight:700}
.sheet-panel .sp-close{
  border:0;background:none;cursor:pointer;color:var(--icon);
  width:32px;height:32px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.sheet-panel .sp-close:active{background:var(--soft)}
.sheet-panel .sp-body{flex:1;overflow-y:auto;padding:14px 18px;}
.sheet-panel .sp-body::-webkit-scrollbar{width:0}
.sheet-panel .sp-foot{
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.sheet-panel .sp-foot .btn-black,
.sheet-panel .sp-foot .btn-line{flex:1;padding:11px;text-align:center}

.card-lib-tabs{display:flex;gap:2px;padding:8px 14px 0;background:var(--card);overflow-x:auto;scrollbar-width:none}
.card-lib-tabs::-webkit-scrollbar{display:none}
.card-lib-tab{
  border:0;background:none;cursor:pointer;font-family:inherit;
  padding:10px 12px;font-size:13px;color:var(--sub);
  border-bottom:2px solid transparent;white-space:nowrap;flex:0 0 auto;transition:all .2s;
}
.card-lib-tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
.card-toolbar{display:flex;gap:2px;padding:8px 8px;border-bottom:1px solid var(--border);}
.card-tool{
  border:0;background:none;cursor:pointer;color:var(--icon);
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.card-tool:active{background:var(--soft)}
.card-tool.on{background:var(--soft);color:var(--accent)}
.group-filter{
  display:flex;gap:6px;padding:8px 12px;overflow-x:auto;
  border-bottom:1px solid var(--border);scrollbar-width:none;
}
.group-filter::-webkit-scrollbar{display:none}
.group-chip{
  border:1px solid var(--border);border-radius:10px;
  background:var(--card);color:var(--text);
  font-size:12px;padding:6px 12px;cursor:pointer;font-family:inherit;
  flex:0 0 auto;white-space:nowrap;
}
.group-chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.card-lib-body{flex:1;overflow-y:auto;padding:14px 14px;}
.card-lib-body::-webkit-scrollbar{width:0}
.card-lib-empty{
  text-align:center;color:var(--sub);padding:50px 20px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.card-lib-empty-text{font-size:12.5px}
.multibar{
  padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.multibar-text{font-size:12px;color:var(--sub);flex:1;min-width:100px}
.group-mgmt-hint{font-size:12.5px;color:var(--sub);text-align:center;padding:20px 10px;line-height:1.7;}
.dashed-btn{
  width:100%;border:1.5px dashed var(--border);background:none;
  border-radius:12px;padding:14px;font-size:13px;
  color:var(--text);cursor:pointer;font-family:inherit;
}
.dashed-btn:active{background:var(--soft)}
.theme-opt{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 4px;border-bottom:1px solid var(--border);cursor:pointer;
}
.theme-opt:last-child{border-bottom:0}
.theme-opt .tick{color:var(--accent);display:none}
.theme-opt.on .tick{display:flex}
.panel-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;gap:10px;
}
.panel-row .pr-label{font-size:13.5px;flex:1}
.panel-row .pr-input{
  width:88px;border:1px solid var(--border);background:var(--soft);
  border-radius:9px;padding:7px 10px;text-align:right;
  font-size:13.5px;font-family:inherit;color:var(--text);outline:none;
}
.panel-row .pr-input:focus{border-color:var(--accent)}
.panel-row .pr-unit{font-size:12px;color:var(--sub);flex:0 0 auto}
.storage-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px;
}
.storage-row:last-child{border-bottom:0}
.storage-row .s-name{color:var(--text)}
.storage-row .s-size{color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app">

  <div class="view active" id="view-main">
    <div class="pager" id="pager">
      <div class="page" id="page1"></div>
      <div class="page" id="page2"></div>
    </div>
    <div class="dots" id="dots">
      <span class="dot active" onclick="goPage(0)"></span>
      <span class="dot" onclick="goPage(1)"></span>
    </div>
  </div>

  <div class="view" id="view-settings">
    <div class="sub-header">
      <button class="back-icon" onclick="navTo('main')">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="var(--icon)" stroke="var(--icon)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <h2>设置</h2>
      <div class="sub-actions"></div>
    </div>
    <div class="scroll-full" id="settingsScroll">
      <div id="settingsList"></div>
    </div>
  </div>

  <div class="view" id="view-sub">
    <div class="sub-header">
      <button class="back-icon" onclick="backSub()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="var(--icon)" stroke="var(--icon)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <h2 id="subTitle"></h2>
      <div class="sub-actions" id="subActions"></div>
    </div>
    <div class="sub-body" id="subBody"></div>
  </div>

  <div class="view" id="view-chatlist">
    <div class="chatlist-header">
      <button class="back-icon" onclick="closeChatList()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="var(--icon)" stroke="var(--icon)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <h2>消息</h2>
      <button class="back-icon" onclick="searchChats()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="var(--icon)" stroke="var(--icon)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
    <div class="chatlist-body" id="chatlistBody"></div>
  </div>

  <div class="view" id="view-chat">
    <div class="chat-topbar">
      <button class="back-icon" onclick="closeChat()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="var(--icon)" stroke="var(--icon)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <div class="chat-top-profile" onclick="openChatInfo()">
        <div class="chat-top-av" id="chatTopAv"></div>
        <div class="chat-top-name" id="chatTopName"></div>
      </div>
      <div class="chat-top-actions">
        <button class="back-icon" onclick="startOutgoingCall()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="var(--icon)" stroke="var(--icon)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg>
        </button>
        <button class="back-icon" onclick="openChatInfo()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="var(--icon)"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
        </button>
      </div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-bar">
      <input id="chatInput" placeholder="">
      <button class="cb-btn" onclick="toggleStickerPanel()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="var(--icon)" stroke="var(--icon)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.3 2 3.5 2 3.5-2 3.5-2"/><circle cx="9" cy="10" r=".9"/><circle cx="15" cy="10" r=".9"/></svg>
      </button>
      <button class="cb-btn" onclick="togglePlusPanel()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="var(--icon)" stroke="var(--icon)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>

  <div class="view" id="view-chatinfo">
    <div class="sub-header">
      <button class="back-icon" onclick="closeChatInfo()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="var(--icon)" stroke="var(--icon)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <h2>聊天信息</h2>
      <div class="sub-actions"></div>
    </div>
    <div class="sub-body" id="chatInfoBody"></div>
  </div>

  <div class="sheet-mask" id="sheetMask" onclick="closePanels()"></div>
  <div class="panel" id="stickerPanel"></div>
  <div class="panel" id="plusPanel"></div>

  <div class="call-overlay" id="callOverlay">
    <div class="call-av" id="callAvatar"></div>
    <div class="call-name" id="callName"></div>
    <div class="call-status" id="callStatus"></div>
    <div class="call-actions" id="callActions"></div>
  </div>

  <div class="sheet-wrap hidden" id="sheetWrap"></div>

  <div class="overlay hidden" id="tutorial">
    <div class="modal">
      <div class="tut-emoji" id="tutEmoji">👋</div>
      <h3 id="tutTitle"></h3>
      <p id="tutText"></p>
      <div class="tut-dots" id="tutDots"></div>
      <div class="modal-btns">
        <button class="btn-line" onclick="closeTutorial()">跳过</button>
        <button class="btn-black" id="tutNext" onclick="nextTut()">下一步</button>
      </div>
    </div>
  </div>

  <div id="netBar">
    <span>⚠️ 加载失败，请检查网络</span>
    <button onclick="retryNet()">更换网络</button>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ========== 基础工具 ========== */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICONS = {
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.4-.7L3 21l1.8-4.8A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/>',
  heart:'<path d="M12 20s-7-4.3-7-9.3A4.2 4.2 0 0 1 12 7.5a4.2 4.2 0 0 1 7 3.2c0 5-7 9.3-7 9.3z"/>',
  letter:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',

  stats:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  divination:'<path d="m12 3 2.2 5.6L20 10l-4.5 3.8L17 20l-5-3-5 3 1.5-6.2L4 10l5.8-1.4z"/>',
  star:'<path d="M12 3.5 14.9 9l6.1.9-4.4 4.3 1 6.1-5.6-2.9-5.6 2.9 1-6.1L3 9.9 9.1 9z"/>',
  music:'<path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>',
  headphones:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
  question:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2-2.5 3.5"/><circle cx="12" cy="17" r=".7"/>',
  period:'<path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/>',
  water:'<path d="M6 8h12l-1.3 11a2 2 0 0 1-2 1.8h-5.4a2 2 0 0 1-2-1.8z"/><path d="M9 8V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v3"/>',
  settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chevron:'<path d="m9 6 6 6-6 6"/>',

function todayStr(d){const dt=d?new Date(d):new Date();return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
function dateOffset(o){return todayStr(Date.now()+o*86400000);}
function fmtTime(ts){
  const d=new Date(ts),n=new Date();
  const hm=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  if(d.toDateString()===n.toDateString()) return hm;
  const y=new Date(n.getTime()-86400000);
  if(d.toDateString()===y.toDateString()) return '昨天 '+hm;
  return `${d.getMonth()+1}/${d.getDate()} ${hm}`;
}
function daysBetween(a,b){return Math.floor((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function fmtSec(s){const m=Math.floor(s/60);const sec=s%60;return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}
function fmtBytes(n){
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(2)+' MB';
}

let audioCtx=null;
function playTap(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='sine';o.frequency.setValueAtTime(880,t);
    o.frequency.exponentialRampToValueAtTime(440,t+0.08);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.2,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(t);o.stop(t+0.15);
  }catch(e){}
}

function ask(title,def,multiline){
  def=def||'';
  return new Promise(resolve=>{
    const ov=document.createElement('div'); ov.className='overlay';
    ov.innerHTML=`

        <h3>${esc(title)}</h3>
        ${multiline
          ? `<textarea class="inp ta" id="askInp">${esc(def)}</textarea>`
          : `<input class="inp" id="askInp" value="${esc(def)}">`}
        <div class="modal-btns">
          <button class="btn-line" data-a="c">取消</button>
          <button class="btn-black" data-a="o">确定</button>
        </div>
      </div>`;
    $('#app').appendChild(ov);
    const inp=ov.querySelector('#askInp');
    setTimeout(()=>{inp.focus();inp.select&&inp.select();},60);
    const done=v=>{ov.remove();resolve(v);};
    ov.querySelector('[data-a="c"]').onclick=()=>done(null);
    ov.querySelector('[data-a="o"]').onclick=()=>done(inp.value);
    inp.onkeydown=e=>{
      if(e.key==='Enter'&&(!multiline||e.ctrlKey||e.metaKey)){e.preventDefault();done(inp.value);}
      if(e.key==='Escape')done(null);
    };
  });
}

function pickImage(cb,max){
  max=max||600;
  const i=document.createElement('input'); i.type='file'; i.accept='image/*';
  i.onchange=()=>{
    const f=i.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        const sc=Math.min(1,max/Math.max(w,h));
        w=Math.round(w*sc);h=Math.round(h*sc);
        const cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cb(cv.toDataURL('image/jpeg',0.85));
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  };
  i.click();
}

function pickCssFile(cb){
  const i=document.createElement('input'); i.type='file'; i.accept='.css,text/css';
  i.onchange=()=>{
    const f=i.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>cb(r.result);
    r.readAsText(f);
  };
  i.click();
}

function doCheckin(){
  const today=todayStr(), yesterday=dateOffset(-1), ck=S.checkin;
  if(ck.last===today) return toast('今天已经打过卡啦');
  if(ck.last===yesterday) ck.streak=(ck.streak||0)+1;
  else{if(ck.last){ck.restoring=true;ck.streak=1;}else ck.streak=1;}
  if(ck.restoring){
    if(ck.streak>=2){ck.restoring=false;ck.days=(ck.days||0)+1;ck.streak=0;toast('连续打卡恢复！天数继续累计 🎉');}
    else toast('恢复中，再打卡一天就恢复啦');
  } else {ck.days=(ck.days||0)+1;toast(`打卡成功 · 连续 ${ck.days} 天`);}
  ck.last=today;save();renderPage1();
}

function exportAllData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='梦角-全部数据.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
  toast('已导出');
}
function importAllData(){
  if(!confirm('导入将覆盖当前全部数据，确定继续？')) return;
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d) throw 0;
        localStorage.setItem(KEY,JSON.stringify(d));
        toast('导入成功');
        setTimeout(()=>location.reload(),600);
      }catch(e){toast('文件格式不正确');}
    };
    r.readAsText(f);
  };
  inp.click();
}
function clearAllData(){
  if(!confirm('清除全部数据？此操作不可恢复！')) return;
  if(!confirm('再次确认：确定要删除所有内容吗？')) return;
  try{localStorage.removeItem(KEY);}catch(e){}
  toast('已清除');
  setTimeout(()=>location.reload(),500);
}

  w.onclick=e=>{if(e.target===w) closeSheet();};
  cardTab='main'; cardGroup='all'; cardMulti=false; cardSel.clear(); cardSearch='';
  renderCardLib();
}
function currentCardStore(){
  return S.cardLib[cardTab] || {cards:[],groups:[]};
}
function renderCardLib(){
  const store=currentCardStore();
  const tabCounts={};
  CARD_TABS.forEach(t=>tabCounts[t.id]=(S.cardLib[t.id]||{}).cards?.length||0);

  let list=store.cards.slice();
  if(cardGroup!=='all'){
    list=list.filter(c=>cardGroup==='none'? !c.group : c.group===cardGroup);
  }
  if(cardSearch){
    const kw=cardSearch.toLowerCase();
    list=list.filter(c=>{
      const text=c.text||c.name||'';
      return text.toLowerCase().includes(kw);
    });
  }

  const groupChips=store.groups.map(g=>{
    const n=store.cards.filter(c=>c.group===g.id).length;
    return `<button class="group-chip ${cardGroup===g.id?'on':''}" onclick="setCardGroup('${g.id}')">${esc(g.name)} ${n}</button>`;
  }).join('');
  const ungroupedCount=store.cards.filter(c=>!c.group).length;

  const body=`
    <div class="card-lib-tabs">
      ${CARD_TABS.map(t=>`
        <button class="card-lib-tab ${cardTab===t.id?'on':''}" onclick="switchCardTab('${t.id}')">
          ${t.label}${tabCounts[t.id]?` ${tabCounts[t.id]}`:''}
        </button>`).join('')}
    </div>
    <div class="card-toolbar">
      <button class="card-tool" onclick="searchCards()" title="搜索">${icon('search',18)}</button>
      <button class="card-tool" onclick="openGroupManager()" title="分组">${icon('folder',18)}</button>
      <button class="card-tool ${cardMulti?'on':''}" onclick="toggleCardMulti()" title="多选">${icon('checkbox',18)}</button>
      <button class="card-tool" onclick="importCards()" title="导入">${icon('download',18)}</button>
      <button class="card-tool" onclick="exportCards()" title="导出">${icon('upload',18)}</button>
    </div>
    ${store.groups.length?`
      <div class="group-filter">
        <button class="group-chip ${cardGroup==='all'?'on':''}" onclick="setCardGroup('all')">全部 ${store.cards.length}</button>
        <button class="group-chip ${cardGroup==='none'?'on':''}" onclick="setCardGroup('none')">未分组 ${ungroupedCount}</button>
        ${groupChips}
      </div>`:''}
    ${cardMulti?`
      <div class="multibar">
        <button class="mini-btn" onclick="selectAllCards()">取消全选</button>
        <span class="multibar-text">点击字卡以选择</span>
        <button class="mini-btn" onclick="groupCards()">分组</button>
        <button class="mini-btn" onclick="blockCards()">屏蔽</button>
        <button class="mini-btn danger" onclick="delSelectedCards()" style="background:#ff3b30;color:#fff;border-color:#ff3b30">删除</button>
      </div>`:''}
    <div class="card-lib-body" id="cardLibBody">
      ${list.length?list.map(c=>renderCardItem(c)).join(''):`
        <div class="card-lib-empty">
          <div style="color:#d4d4d4">${icon('search',32)}</div>
          <div class="card-lib-empty-text">列表空空如也</div>
          <div class="card-lib-empty-text" style="opacity:.7;font-size:11.5px">暂无内容</div>
        </div>`}
    </div>
  `;
  const foot=`
    <button class="btn-black" onclick="addCardItem()">+ 新增</button>
    <button class="btn-line" onclick="closeSheet()">关闭</button>
  `;
  $('#sheetWrap').innerHTML=panelHTML('字卡库', body, foot);
}

function renderCardItem(c){
  const selected=cardSel.has(c.id);
  const isImg=c.type==='image'||cardTab==='stickers';
  const isVoice=c.type==='voice'||cardTab==='voice';
  return `
    <div class="fav-item ${selected?'sel':''}" data-id="${c.id}" onclick="cardItemClick('${c.id}')" oncontextmenu="event.preventDefault();quickDelCard('${c.id}')">
      ${cardMulti?`<div class="fav-check ${selected?'on':''}">✓</div>`:''}
      <div style="flex:1;min-width:0">
        ${isImg?`<img src="${c.src}" style="max-width:60px;border-radius:8px;display:block">`:
          isVoice?`<div style="display:flex;align-items:center;gap:6px;font-size:13px">${icon('voice',14)} 语音</div>`:
          `<div class="fav-text">${esc(c.text||'')}</div>`}
        ${c.group?`<div class="fav-time">分组：${esc(store_groupName(c.group))}</div>`:''}
      </div>
    </div>`;
}
function store_groupName(gid){
  const store=currentCardStore();
  const g=store.groups.find(x=>x.id===gid);
  return g?g.name:'';
}
function switchCardTab(t){ cardTab=t; cardGroup='all'; cardSel.clear(); cardSearch=''; renderCardLib(); }
function setCardGroup(g){ cardGroup=g; renderCardLib(); }
function searchCards(){
  ask('搜索字卡','').then(v=>{
    if(v===null) return;
    cardSearch=v.trim();
    renderCardLib();
  });
}
function toggleCardMulti(){ cardMulti=!cardMulti; cardSel.clear(); renderCardLib(); }
function selectAllCards(){ cardSel.clear(); renderCardLib(); }
function cardItemClick(id){
  if(cardMulti){
    if(cardSel.has(id)) cardSel.delete(id); else cardSel.add(id);
    renderCardLib();
    return;
  }
  const store=currentCardStore();
  const c=store.cards.find(x=>x.id===id);
  if(!c) return;
  ask('编辑字卡', c.text||'', cardTab==='main'||cardTab==='kaomoji'||cardTab==='emoji').then(v=>{
    if(v===null) return;
    if(c.text!==undefined) c.text=v.trim();
    save(); renderCardLib();
  });
}
function quickDelCard(id){
  if(!confirm('删除这条字卡？')) return;
  const store=currentCardStore();
  store.cards=store.cards.filter(x=>x.id!==id);
  save(); renderCardLib();
}
async function addCardItem(){
  if(cardTab==='stickers'){
    pickImage(data=>{
      const store=currentCardStore();
      store.cards.push({id:uid(),src:data,type:'image',group:''});
      save(); renderCardLib(); toast('已添加');
    },300);
    return;
  }
  if(cardTab==='voice'){
    toast('语音功能开发中');
    return;
  }
  const v=await ask('添加字卡','',true);
  if(v===null||!v.trim()) return;
  const store=currentCardStore();
  v.split('\n').forEach(line=>{
    const t=line.trim();
    if(t) store.cards.push({id:uid(),text:t,group:''});
  });
  save(); renderCardLib(); toast('已添加');
}
function exportCards(){
  const store=currentCardStore();
  const data=store.cards.map(c=>c.text||c.src||'');
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`字卡-${cardTab}.json`;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
  toast('已导出');
}
function importCards(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const arr=JSON.parse(r.result);
        if(!Array.isArray(arr)) throw 0;
        const store=currentCardStore();
        arr.forEach(t=>{
          if(typeof t==='string'&&t.trim()) store.cards.push({id:uid(),text:t.trim(),group:''});
        });
        save(); renderCardLib(); toast('导入成功');
      }catch(e){toast('格式不正确');}
    };
    r.readAsText(f);
  };
  inp.click();
}
function delSelectedCards(){
  if(!cardSel.size) return toast('请先选择字卡');
  if(!confirm(`删除选中的 ${cardSel.size} 条？`)) return;
  const store=currentCardStore();
  store.cards=store.cards.filter(c=>!cardSel.has(c.id));
  cardSel.clear(); cardMulti=false;
  save(); renderCardLib(); toast('已删除');
}
function groupCards(){
  if(!cardSel.size) return toast('请先选择字卡');
  const store=currentCardStore();
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
    <div class="modal">
      <h3>分组</h3>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
        <button class="btn-line" data-g="">未分组</button>
        ${store.groups.map(g=>`<button class="btn-line" data-g="${g.id}">${esc(g.name)}</button>`).join('')}
      </div>
      <div class="modal-btns"><button class="btn-line" data-a="c">取消</button></div>
    </div>`;
  $('#app').appendChild(ov);
  ov.querySelector('[data-a="c"]').onclick=()=>ov.remove();
  ov.querySelectorAll('[data-g]').forEach(b=>{
    b.onclick=()=>{
      const gid=b.dataset.g;
      store.cards.forEach(c=>{ if(cardSel.has(c.id)) c.group=gid; });
      cardSel.clear(); cardMulti=false;
      save(); renderCardLib(); ov.remove(); toast('已分组');
    };
  });
}
function blockCards(){
  if(!cardSel.size) return toast('请先选择字卡');
  toast('已屏蔽');
}

function openGroupManager(){
  const store=currentCardStore();
  const body=`
    ${store.groups.length?store.groups.map(g=>`
      <div class="panel-row">
        <div class="pr-label">${esc(g.name)}</div>
        <button class="mini-btn danger" onclick="delGroup('${g.id}')">删除</button>
      </div>`).join(''):
      `<div class="group-mgmt-hint">还没有分组；点击下方按钮创建第一个分组</div>`}
    <button class="dashed-btn" style="margin-top:14px" onclick="addGroup()">+ 新建分组</button>
  `;
  const foot=`<button class="btn-black" onclick="renderCardLib()">返回</button>`;
  $('#sheetWrap').innerHTML=panelHTML('分组管理', body, foot);
}
async function addGroup(){
  const n=await ask('分组名称','');
  if(!n||!n.trim()) return;
  const store=currentCardStore();
  store.groups.push({id:uid(),name:n.trim()});
  save(); openGroupManager(); toast('已创建分组');
}
function delGroup(gid){
  if(!confirm('删除这个分组？分组的字卡将变为未分组')) return;
  const store=currentCardStore();
  store.groups=store.groups.filter(g=>g.id!==gid);
  store.cards.forEach(c=>{ if(c.group===gid) c.group=''; });
  save(); openGroupManager();
}

/* ========== 消息列表 ========== */
function openChatList(){renderChatList();switchView('chatlist');}
function closeChatList(){switchView('main');}

function renderChatList(){
  const list=$('#chatlistBody');
  if(!S.chats.length){list.innerHTML='<div class="empty">还没有对话哦</div>';return;}
  const sorted=[...S.chats].sort((a,b)=>{
    if(a.settings.pin&&!b.settings.pin)return -1;
    if(b.settings.pin&&!a.settings.pin)return 1;
    const la=a.messages[a.messages.length-1],lb=b.messages[b.messages.length-1];
    return (lb?lb.ts:0)-(la?la.ts:0);
  });
  list.innerHTML=sorted.map(c=>{
    const last=c.messages[c.messages.length-1];
    let preview='还没有对话哦';
    if(last){
      if(last.type==='image') preview='[图片]';
      else if(last.type==='redpacket') preview='[红包]';
      else if(last.type==='call') preview=last.text;
      else if(last.type==='song') preview='[一起听歌]';
      else preview=last.text;
    }
    return `
      <div class="chatlist-item" onclick="openChat('${c.id}')">
        <div class="chatlist-av">${avatarHTML(c.avatar,c.name,48)}</div>
        <div class="chatlist-main">
          <div class="chatlist-name">${esc(c.name)}</div>
          <div class="chatlist-last">${esc(preview).slice(0,40)}</div>
        </div>
        <div class="chatlist-time">${last?fmtTime(last.ts):''}</div>
      </div>`;
  }).join('');
}

async function searchChats(){
  const q=await ask('搜索','');
  if(!q||!q.trim())return;
  const kw=q.trim();
  const found=S.chats.filter(c=>c.name.includes(kw)||c.messages.some(m=>m.text&&m.text.includes(kw)));
  if(!found.length) return toast('没有找到');
  $('#chatlistBody').innerHTML=found.map(c=>`
    <div class="chatlist-item" onclick="openChat('${c.id}')">
      <div class="chatlist-av">${avatarHTML(c.avatar,c.name,48)}</div>
      <div class="chatlist-main">
        <div class="chatlist-name">${esc(c.name)}</div>
        <div class="chatlist-last">匹配到对话</div>
      </div>
    </div>`).join('');
  toast(`找到 ${found.length} 个`);
}

/* ========== 聊天对话 ========== */
let chatReplyTimers={};
const readNoReplyChance=0.05;

function openChat(id){
  S.activeChatId=id;
  const c=activeChat();
  if(c){c.unread=0;c.lastReadTs=Date.now();}
  save();renderChatView();applyChatCss();switchView('chat');
}
function closeChat(){switchView('main');}

function renderChatView(){
  const c=activeChat();if(!c)return;
  $('#chatTopAv').innerHTML=avatarHTML(c.avatar,c.name,32);
  $('#chatTopName').textContent=c.name;
  const inp=$('#chatInput');if(inp) inp.placeholder='';
  renderChatMessages();
}

function renderChatMessages(){
  const c=activeChat();if(!c)return;
  const el=$('#chatBody');
  if(!c.messages.length){
    el.innerHTML=`
      <div class="chat-empty">
        <svg viewBox="0 0 100 100" width="80" height="80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="50" cy="50" r="35"/>
          <circle cx="38" cy="43" r="2.5" fill="currentColor" stroke="none"/>
          <circle cx="62" cy="43" r="2.5" fill="currentColor" stroke="none"/>
          <path d="M35 60 Q50 75 65 60"/>
        </svg>
        <div class="chat-empty-text">还没有聊天哦，快来增加感情吧</div>
      </div>`;
    return;
  }
  let html='';let lastTs=0;
  c.messages.forEach((m,idx)=>{
    if(c.settings.showTime && m.ts-lastTs>300000) html+=`<div class="msg-time">${fmtTime(m.ts)}</div>`;
    lastTs=m.ts;
    html+=renderMsg(m,c,idx);
  });
  if(c.typing){
    html+=`<div class="msg them">
      <div class="msg-av" style="width:${c.settings.avatarSize}px;height:${c.settings.avatarSize}px;border-radius:${c.settings.avatarShape==='square'?'8px':'50%'}">
        ${avatarHTML(c.avatar,c.name,c.settings.avatarSize)}
      </div>
      <div class="msg-bubble typing-bubble" style="background:var(--msg-them);color:var(--sub)">正在输入中
        <span class="tdots" style="display:inline-flex;gap:3px;margin-left:4px"><i style="width:4px;height:4px;border-radius:50%;background:currentColor;animation:bl 1.2s infinite"></i><i style="width:4px;height:4px;border-radius:50%;background:currentColor;animation:bl 1.2s infinite;animation-delay:.2s"></i><i style="width:4px;height:4px;border-radius:50%;background:currentColor;animation:bl 1.2s infinite;animation-delay:.4s"></i></span>
      </div>
    </div>`;
  }
  el.innerHTML=html;
  el.querySelectorAll('.msg').forEach((row,idx)=>{
    const bubble=row.querySelector('.msg-bubble');
    if(!bubble) return;
    bindMsgLongPress(bubble,c.messages[idx]?c.messages[idx].id:null,c);
  });
  requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight;});
}

function renderMsg(m,c,idx){
  const mine=m.from==='me';
  const who=mine?S.me:c;
  const sz=c.settings.avatarSize;
  const radius=c.settings.avatarShape==='square'?'8px':'50%';
  const myBubbleBg=c.settings.bubbleColor&&mine?c.settings.bubbleColor:'';
  const bubbleStyle=`
    ${myBubbleBg?`background:${myBubbleBg};`:''}
    ${c.settings.bubbleSize?`padding:${Math.max(6,c.settings.bubbleSize-4)}px ${c.settings.bubbleSize}px;`:''}
    ${c.settings.bubbleRadius?`border-radius:${c.settings.bubbleRadius}px;`:''}
    ${c.settings.fontSize?`font-size:${c.settings.fontSize}px;`:''}
  `;
  const av=`<div class="msg-av" style="width:${sz}px;height:${sz}px;border-radius:${radius}">
    ${avatarHTML(who.avatar,who.name,sz)}
  </div>`;
  let content='';
  if(m.type==='sticker') content=`<img src="${m.src}" style="max-width:110px;border-radius:10px;display:block">`;
  else if(m.type==='image') content=`<img src="${m.src}" style="max-width:180px;border-radius:10px;display:block">`;
  else if(m.type==='redpacket') content=`<div style="display:flex;align-items:center;gap:8px;min-width:140px"><span style="font-size:20px">🧧</span><div><div style="font-weight:600">${esc(m.text||'恭喜发财')}</div><div style="font-size:11px;opacity:.8">¥${m.amount||0}</div></div></div>`;
  else if(m.type==='call') content=`<div style="display:flex;align-items:center;gap:8px">📞 ${esc(m.text)}</div>`;
  else if(m.type==='song') content=`
    <div style="display:flex;align-items:center;gap:10px;min-width:150px;cursor:pointer"
      onclick="event.stopPropagation();openMusic('${m.songId||''}')">
      <span style="display:flex;align-items:center;color:#888">${icon('headphones',22)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px">${esc(m.text||'一起听歌')}</div>
        <div style="font-size:10.5px;opacity:.75;margin-top:2px">点击一起听</div>
      </div>
    </div>`;
  else content=esc(m.text).replace(/\n/g,'<br>');
  const sys=m.type==='system'?'msg-sys':'';
  if(sys) return `<div class="${sys}">${esc(m.text)}</div>`;
  return `<div class="msg ${mine?'mine':'them'}">
    ${av}
    <div class="msg-bubble" style="${bubbleStyle}" data-mid="${m.id}">${content}</div>
  </div>`;
}

function bindMsgLongPress(el,msgId,c){
  let timer;
  const start=()=>{timer=setTimeout(()=>showMsgMenu(el,msgId,c),550);};
  const cancel=()=>clearTimeout(timer);
  el.addEventListener('touchstart',start,{passive:true});
  el.addEventListener('touchend',cancel);
  el.addEventListener('touchmove',cancel,{passive:true});
  el.addEventListener('mousedown',start);
  el.addEventListener('mouseup',cancel);
  el.addEventListener('mouseleave',cancel);
}

function showMsgMenu(el,msgId,c){
  const m=c.messages.find(x=>x.id===msgId);if(!m)return;
  const isMine=m.from==='me';
  const existing=document.querySelector('.msg-menu');
  if(existing) existing.remove();
  const menu=document.createElement('div');menu.className='msg-menu';
  menu.innerHTML=`
    <button data-a="del" class="danger">删除</button>
    <button data-a="fav">收藏</button>
    <button data-a="copy">复制</button>
    <button data-a="reply">回复</button>
    ${isMine&&m.type==='text'?'<button data-a="edit">编辑</button>':''}
  `;
  $('#app').appendChild(menu);
  const rect=el.getBoundingClientRect(),appRect=$('#app').getBoundingClientRect();
  menu.style.left=Math.min(Math.max(10,rect.left-appRect.left),appRect.width-150)+'px';
  menu.style.top=Math.max(10,rect.top-appRect.top-200)+'px';
  menu.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.a;menu.remove();
      if(a==='del'){c.messages=c.messages.filter(x=>x.id!==msgId);save();renderChatMessages();toast('已删除');}
      else if(a==='fav'){S.favoritesMine.push({id:uid(),text:m.text||'[非文本]',ts:Date.now()});save();toast('已收藏');}
      else if(a==='copy'){if(navigator.clipboard&&m.text) navigator.clipboard.writeText(m.text).then(()=>toast('已复制'));else toast('复制失败');}
      else if(a==='reply'){const inp=$('#chatInput');if(inp){inp.value='回复：'+(m.text||'');inp.focus();}}
      else if(a==='edit'){if(m.type!=='text') return toast('只能编辑文本');
        ask('编辑',m.text).then(v=>{
          if(v===null||!v.trim())return;
          m.text=v.trim();save();renderChatMessages();toast('已保存');
        });
      }
    };
  });
  setTimeout(()=>{
    const closeHandler=e=>{
      if(!e.target.closest('.msg-menu')){menu.remove();document.removeEventListener('click',closeHandler);}
    };
    document.addEventListener('click',closeHandler);
  },50);
}

function sendChat(){
  const inp=$('#chatInput');
  const text=inp.value.trim();
  if(!text)return;
  const c=activeChat();
  c.messages.push({id:uid(),from:'me',type:'text',text,ts:Date.now()});
  inp.value='';save();renderChatMessages();scheduleReply(c);
}

function pickFromCardLib(){
  const lib=S.cardLib;
  const extras=[];
  ['kaomoji','emoji','stickers'].forEach(k=>{
    (lib[k]?.cards||[]).forEach(c=>extras.push({...c,kind:k}));
  });
  if(extras.length && Math.random()<0.5){
    const pick=extras[Math.floor(Math.random()*extras.length)];
    if(pick.kind==='stickers' && pick.src){
      return {type:'sticker',src:pick.src};
    }
    return {type:'text',text:pick.text};
  }
  const main=lib.main?.cards||[];
  if(!main.length) return null;
  const c=main[Math.floor(Math.random()*main.length)];
  return {type:'text',text:c.text};
}

function scheduleReply(c){
  clearTimeout(chatReplyTimers[c.id]);
  const s=S.settings;
  const minMs=Math.max(1,Number(s.replyMin)||1)*1000;
  const maxMs=Math.max(minMs,(Number(s.replyMax)||10)*1000);
  const delay=minMs+Math.random()*(maxMs-minMs);

  c.typing=true;
  if(S.activeChatId===c.id) renderChatMessages();

  chatReplyTimers[c.id]=setTimeout(()=>{
    c.typing=false;
    if(Math.random()<readNoReplyChance){
      if(S.activeChatId===c.id) renderChatMessages();
      return;
    }
    const count=Math.floor(Math.random()*((s.replyCountMax-s.replyCountMin)+1))+s.replyCountMin;
    const total=Math.max(1,count);
    let pushed=0;
    for(let i=0;i<total;i++){
      const pick=pickFromCardLib();
      if(!pick){pushed=0;break;}
      setTimeout(()=>{
        if(pick.type==='sticker'){
          c.messages.push({id:uid(),from:'them',type:'sticker',src:pick.src,ts:Date.now()});
        } else {
          c.messages.push({id:uid(),from:'them',type:'text',text:pick.text,ts:Date.now()});
        }
        c.lastReadTs=Date.now();save();
        if(S.activeChatId===c.id && currentView==='chat') renderChatMessages();
        else c.unread=(c.unread||0)+1;
        playTap();
      }, i*600);
      pushed++;
    }
    if(pushed===0){
      if(S.activeChatId===c.id) renderChatMessages();
      toast('字卡库是空的，先去「设置 → 字卡」添加吧');
    }
  },delay);
}

/* ========== 通话 ========== */
let callState=null,callTickTimer=null;

function startOutgoingCall(){
  const c=activeChat();if(!c)return;
  callState={id:uid(),chatId:c.id,from:'me',status:'calling',sec:0};
  showCallScreen('正在呼叫…');
  let answerTimer=setTimeout(()=>{
    if(Math.random()<0.8){
      callState.status='connected';callState.startTs=Date.now();
      showCallScreen('00:00');
      callTickTimer=setInterval(()=>{callState.sec++;showCallScreen(fmtSec(callState.sec));},1000);
    } else {callState.status='noAnswer';endCall('对方未应答');}
  },2000+Math.random()*4000);
  callState.answerTimer=answerTimer;
  callState.timeoutTimer=setTimeout(()=>{
    if(callState&&callState.status==='calling'){clearTimeout(answerTimer);callState.status='noAnswer';endCall('对方未应答');}
  },60000);
}
function showCallScreen(status){
  const c=activeChat();
  $('#callOverlay').classList.add('on');
  $('#callAvatar').innerHTML=avatarHTML(c.avatar,c.name,100);
  $('#callName').textContent=c.name;
  $('#callStatus').textContent=status;
  const actions=$('#callActions');
  if(callState.status==='calling'||callState.status==='connected'){
    actions.innerHTML=`<button class="call-btn hang" onclick="userHangUp()">✕</button>`;
  } else if(callState.status==='incoming'){
    actions.innerHTML=`<button class="call-btn hang" onclick="rejectIncoming()">✕</button><button class="call-btn answer" onclick="acceptIncoming()">📞</button>`;
  }
}
function userHangUp(){
  if(!callState)return;
  if(callState.status==='connected') endCall(`通话 ${fmtSec(callState.sec)}`,true);
  else if(callState.status==='calling') endCall('对方已拒绝',true);
}
function rejectIncoming(){if(!callState)return;endCall('对方已拒绝',true);}
function acceptIncoming(){
  if(!callState)return;
  callState.status='connected';callState.sec=0;callState.startTs=Date.now();
  showCallScreen('00:00');
  callTickTimer=setInterval(()=>{callState.sec++;showCallScreen(fmtSec(callState.sec));},1000);
}
function endCall(text,showInChat){
  if(!callState)return;
  clearInterval(callTickTimer);
  clearTimeout(callState.answerTimer);
  clearTimeout(callState.timeoutTimer);
  $('#callOverlay').classList.remove('on');
  if(showInChat){
    const c=S.chats.find(x=>x.id===callState.chatId);
    if(c){
      c.messages.push({id:uid(),from:callState.from==='me'?'me':'them',type:'call',text,ts:Date.now()});
      save();
      if(S.activeChatId===c.id&&currentView==='chat') renderChatMessages();
    }
  }
  callState=null;
}
function triggerIncomingCall(){
  if(callState)return;
  if(Math.random()>=0.5) return;
  const c=S.chats[Math.floor(Math.random()*S.chats.length)];
  if(!c)return;
  callState={id:uid(),chatId:c.id,from:'them',status:'incoming',sec:0};
  $('#callAvatar').innerHTML=avatarHTML(c.avatar,c.name,100);
  $('#callName').textContent=c.name;
  $('#callStatus').textContent='来电…';
  $('#callOverlay').classList.add('on');
  $('#callActions').innerHTML=`<button class="call-btn hang" onclick="rejectIncoming()">✕</button><button class="call-btn answer" onclick="acceptIncoming()">📞</button>`;
  callState.timeoutTimer=setTimeout(()=>{
    if(callState&&callState.status==='incoming') endCall('对方未应答',true);
  },30000);
}

/* ========== 梦角邀请听歌 ========== */
function triggerSongInvite(){
  if(!S.music.length) return;
  if(Math.random() >= 0.5) return;
  const c = activeChat();
  if(!c) return;
  if(c.typing) return;
  const song = S.music[Math.floor(Math.random()*S.music.length)];
  c.messages.push({
    id: uid(),
    from: 'them',
    type: 'song',
    text: `想和你一起听《${song.name}》`,
    songId: song.id,
    songName: song.name,
    ts: Date.now()
  });
  save();
  if(S.activeChatId === c.id && currentView === 'chat'){
    renderChatMessages();
  } else {
    c.unread = (c.unread || 0) + 1;
  }
  playTap();

    try { new Notification(c.name, { body: `想和你一起听《${song.name}》` }); } catch(e){}
  }
}

function renderPeriodBody(){
  const body=$('#subBody');body.style.padding='4px 16px 24px';
  const first=new Date(perY,perM,1);
  const startDay=first.getDay();
  const daysInMonth=new Date(perY,perM+1,0).getDate();
  const prevDays=new Date(perY,perM,0).getDate();
  const today=todayStr();
  let cells='';
  for(let i=startDay-1;i>=0;i--) cells+=`<div class="cal-day other">${prevDays-i}</div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${perY}-${String(perM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls=[ds===today?'today':'',S.period.records.includes(ds)?'marked':''].join(' ');
    cells+=`<div class="cal-day ${cls}" onclick="periodClick('${ds}')">${d}</div>`;
  }
  const remain=(7-((startDay+daysInMonth)%7))%7;
  for(let i=1;i<=remain;i++) cells+=`<div class="cal-day other">${i}</div>`;
  const nextP=predictNext();
  body.innerHTML=`
    <div class="cal-head">
      <div class="cal-month">${perY}年${perM+1}月</div>
      <div class="cal-nav"><button onclick="perPrev()">‹</button><button onclick="perNext()">›</button></div>
    </div>
    <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div class="cal-grid">${cells}</div>
    <div class="tip">
      ${S.period.records.length?`已记录 ${S.period.records.length} 天<br>`:''}
      ${nextP?`预计下次经期：${nextP}<br>（前 3 天会提醒）`:'点击日期即可标记经期'}
    </div>`;
}
function perPrev(){perM--;if(perM<0){perM=11;perY--;}renderPeriodBody();}
function perNext(){perM++;if(perM>11){perM=0;perY++;}renderPeriodBody();}
function periodClick(ds){
  const i=S.period.records.indexOf(ds);
  if(i>=0){S.period.records.splice(i,1);toast('已取消');}
  else{S.period.records.push(ds);toast('已记录');}
  save();renderPeriodBody();renderPage2();
}
function predictNext(){
  if(!S.period.records.length) return '';
  const sorted=[...S.period.records].sort();
  const last=sorted[sorted.length-1];
  const n=new Date(last+'T00:00:00');
  n.setDate(n.getDate()+(S.period.cycle||28));
  return todayStr(n);
}
async function periodSettings(){
  const c=await ask('周期天数',String(S.period.cycle||28));
  if(c===null)return;
  S.period.cycle=Math.max(1,parseInt(c)||28);
  S.period.remind=confirm('是否开启经期前 3 天提醒？');
  save();renderPeriodBody();toast('已保存');
}

    </div>
    <div class="stat-card">

      ${theirTop.length?theirTop.map((w,i)=>`<div class="top-word"><span class="rank">TOP.${i+1}</span><span class="word">${esc(w[0])}</span><span class="count">${w[1]} 次</span></div>`).join(''):'<div style="font-size:12.5px;color:var(--sub);padding:6px 0">暂无数据</div>'}
    </div>
    <div class="stat-card">
      <div class="stat-title">最近 7 天</div>
      ${recent.length?recent.reverse().map(([d,c])=>`
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0">
          <span style="font-size:11.5px;color:var(--sub);width:60px">${d.slice(5)}</span>
          <div style="flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden">
            <div style="height:100%;width:${(c/max*100).toFixed(0)}%;background:var(--accent);border-radius:3px"></div>
          </div>
          <span style="font-size:11.5px;color:var(--sub);width:24px;text-align:right">${c}</span>
        </div>`).join(''):'<div class="empty" style="padding:16px 0">暂无数据</div>'}
    </div>`;
}
function topWords(messages,from){
  const counter={};
  messages.filter(m=>m.from===from&&m.text).forEach(m=>{
    const clean=m.text.replace(/[^\u4e00-\u9fa5]/g,'');
    for(let i=0;i<clean.length-1;i++){
      const w=clean.slice(i,i+2);
      counter[w]=(counter[w]||0)+1;
    }
  });
  return Object.entries(counter).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,5);
}
