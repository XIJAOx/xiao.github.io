        <div class="div-emoji">🔮</div><div class="div-name">塔罗牌</div><div class="div-sub">78 张 · 正逆位</div>
      </div>
      <div class="div-choice ${divType==='lenormand'?'sel':''}" onclick="setDivType('lenormand')">
        <div class="div-emoji">🌙</div><div class="div-name">雷诺曼</div><div class="div-sub">36 张</div>
      </div>
    </div>
    <div class="card-label">你想问什么？</div>
    <textarea class="inp ta" id="divQ" placeholder="输入你的问题…" style="min-height:76px"></textarea>
    <div class="card-label" style="margin-top:16px">选择牌数</div>
    <div class="chip-row">
      ${[1,3,7].map(n=>`<button class="chip ${divCount===n?'on':''}" onclick="setDivCount(${n})">${n} 张</button>`).join('')}
    </div>
    <button class="btn-black" style="width:100%;margin-top:24px" onclick="doDivination()">开始占卜</button>
    <div class="tip">每次占卜都会重新洗牌打乱，结果随机。</div>`;
}
function setDivType(t){divType=t;renderDivStep1();}
function setDivCount(n){divCount=n;renderDivStep1();}
function doDivination(){
  const q=($('#divQ')||{}).value||'';
  const question=q.trim();
  const deck=divType==='tarot'?buildTarot():[...LENORMAND];
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  const drawn=deck.slice(0,divCount).map(name=>({name,reversed:divType==='tarot'&&Math.random()<0.5}));
  S.divinations.push({id:uid(),type:divType,question,cards:drawn,ts:Date.now()});
  save();
  const body=$('#subBody');body.style.padding='4px 16px 24px';
  body.innerHTML=`
    <div class="card" style="text-align:center;padding:24px 18px">
      <div style="font-size:32px;margin-bottom:10px">✨</div>
      <div style="font-size:14.5px;font-weight:600">占卜完成</div>
      ${question?`<div style="font-size:12.5px;color:var(--sub);margin-top:10px">「${esc(question)}」</div>`:''}
    </div>
    <div class="card-label" style="margin-top:18px">抽到的牌</div>
    ${drawn.map((c,i)=>`
      <div class="div-result">
        <div class="div-result-name">${i+1}. ${esc(c.name)}${c.reversed?' <span class="reversed">(逆位)</span>':(divType==='tarot'?' <span class="upright">(正位)</span>':'')}</div>
        <div class="div-result-desc">${divType==='tarot'?'塔罗牌':'雷诺曼'}</div>
      </div>`).join('')}
    <button class="btn-black" style="width:100%;margin-top:18px" onclick="replaceSub('divination')">再占一次</button>`;
}

/* ========== 子页面：收藏 ========== */
let favTab='mine',favSelect=false,favSel=new Set();
function subFavorites(){
  $('#subTitle').textContent='收藏';
  updateFavActions();renderFavBody();
}
function updateFavActions(){
  $('#subActions').innerHTML=`
    <button class="back-icon" onclick="toggleFavSelect()" style="font-size:13px;width:auto;padding:0 10px">${favSelect?'完成':'多选'}</button>
    <button class="back-icon" onclick="addFav()">${icon('plus',20)}</button>`;
}
function renderFavBody(){
  const body=$('#subBody');body.style.padding='4px 16px 24px';
  const list=favTab==='mine'?S.favoritesMine:S.favoritesTheirs;
  body.innerHTML=`
    <div class="tabs">
      <button class="tab ${favTab==='mine'?'on':''}" onclick="setFavTab('mine')">我的收藏</button>
      <button class="tab ${favTab==='theirs'?'on':''}" onclick="setFavTab('theirs')">TA 的收藏</button>
    </div>
    ${list.length?list.map(f=>`
      <div class="fav-item ${favSel.has(f.id)?'sel':''}" data-id="${f.id}"
        onclick="favClick('${f.id}')" oncontextmenu="event.preventDefault();delFav('${f.id}')">
        ${favSelect?`<div class="fav-check ${favSel.has(f.id)?'on':''}">✓</div>`:''}
        <div style="flex:1;min-width:0">
          <div class="fav-text">${esc(f.text)}</div>
          <div class="fav-time">${fmtTime(f.ts)}</div>
        </div>
      </div>`).join('')
      :'<div class="empty">还没有收藏</div>'}
    ${favSelect&&favSel.size?`<button class="btn-black" style="width:100%;margin-top:14px" onclick="delFavSelected()">删除选中（${favSel.size}）</button>`:''}`;
  if(!favSelect) bindFavLongPress();
}
function bindFavLongPress(){
  $$('.fav-item').forEach(el=>{
    let t;
    const start=()=>{t=setTimeout(()=>{favSelect=true;favSel.clear();favSel.add(el.dataset.id);updateFavActions();renderFavBody();},600);};
    const cancel=()=>clearTimeout(t);
    el.addEventListener('touchstart',start,{passive:true});
    el.addEventListener('touchend',cancel);
    el.addEventListener('touchmove',cancel,{passive:true});
    el.addEventListener('mousedown',start);
    el.addEventListener('mouseup',cancel);
    el.addEventListener('mouseleave',cancel);
  });
}
function setFavTab(t){favTab=t;favSel.clear();renderFavBody();}
function toggleFavSelect(){favSelect=!favSelect;favSel.clear();updateFavActions();renderFavBody();}
function favClick(id){
  if(favSelect){if(favSel.has(id)) favSel.delete(id);else favSel.add(id);renderFavBody();}
  else{
    const list=favTab==='mine'?S.favoritesMine:S.favoritesTheirs;
    const f=list.find(x=>x.id===id);
    if(f) toast(f.text.slice(0,40));
  }
}
async function addFav(){
  const text=await ask('收藏内容','',true);
  if(text===null||!text.trim())return;
  const item={id:uid(),text:text.trim(),ts:Date.now()};
  if(favTab==='mine') S.favoritesMine.push(item);else S.favoritesTheirs.push(item);
  save();renderFavBody();toast('已收藏');
}
function delFav(id){
  if(!confirm('删除这条收藏？')) return;
  if(favTab==='mine') S.favoritesMine=S.favoritesMine.filter(x=>x.id!==id);
  else S.favoritesTheirs=S.favoritesTheirs.filter(x=>x.id!==id);
  save();renderFavBody();
}
function delFavSelected(){
  if(!confirm(`删除选中的 ${favSel.size} 条？`)) return;
  if(favTab==='mine') S.favoritesMine=S.favoritesMine.filter(x=>!favSel.has(x.id));
  else S.favoritesTheirs=S.favoritesTheirs.filter(x=>!favSel.has(x.id));
  favSel.clear();favSelect=false;save();updateFavActions();renderFavBody();
}

/* ========== 子页面：音乐 ========== */
let musicTab='library',musicSelect=false,musicSel=new Set();
function subMusic(){
  $('#subTitle').textContent='音乐';
  updateMusicActions();renderMusicBody();
}
function updateMusicActions(){
  $('#subActions').innerHTML=`
    <button class="back-icon" onclick="toggleMusicSelect()" style="font-size:13px;width:auto;padding:0 10px">${musicSelect?'完成':'批量管理'}</button>
    <button class="back-icon" onclick="addMusic()">${icon('plus',20)}</button>`;
}
function renderMusicBody(){
  const body=$('#subBody');body.style.padding='4px 16px 24px';
  let list=[];
  if(musicTab==='library') list=S.music;
  else if(musicTab==='favMine') list=S.musicFavMine;
  else list=S.musicFavTheirs;
  body.innerHTML=`
    <div class="tabs">
      <button class="tab ${musicTab==='library'?'on':''}" onclick="setMusicTab('library')">我的音乐库</button>
      <button class="tab ${musicTab==='favMine'?'on':''}" onclick="setMusicTab('favMine')">我的收藏</button>
      <button class="tab ${musicTab==='favTheirs'?'on':''}" onclick="setMusicTab('favTheirs')">TA 的收藏</button>
    </div>
    ${list.length?list.map(m=>`
      <div class="music-item">
        ${musicSelect?`<div class="fav-check ${musicSel.has(m.id)?'on':''}" onclick="musicClick('${m.id}')" style="cursor:pointer">✓</div>`:''}
        <div class="music-cover">${icon('music',17)}</div>
        <div class="music-info">
          <div class="music-name">${esc(m.name)}</div>
          <div class="music-src">${esc(m.source||'链接')}</div>
        </div>
        <div class="music-act">
          <button class="mini-btn" onclick="openMusic('${m.id}')">打开</button>
          ${!musicSelect?`<button class="mini-btn danger" onclick="delMusic('${m.id}')">删</button>`:''}
        </div>
      </div>`).join('')
      :'<div class="empty">还没有音乐</div>'}
    ${musicSelect&&musicSel.size?`<button class="btn-black" style="width:100%;margin-top:14px" onclick="delMusicSelected()">删除选中（${musicSel.size}）</button>`:''}`;
}
function setMusicTab(t){musicTab=t;musicSel.clear();renderMusicBody();}
function toggleMusicSelect(){musicSelect=!musicSelect;musicSel.clear();updateMusicActions();renderMusicBody();}
function musicClick(id){if(musicSelect){if(musicSel.has(id)) musicSel.delete(id);else musicSel.add(id);renderMusicBody();}}
async function addMusic(){
  const url=await ask('音乐链接','');
  if(url===null||!url.trim())return;
  const name=await ask('歌曲名称','未命名');
  if(name===null||!name.trim())return;
  let source='链接';
  if(/music\.163\.com/.test(url)) source='网易云音乐';
  else if(/y\.qq\.com/.test(url)) source='QQ音乐';
  const item={id:uid(),name:name.trim(),url:url.trim(),source};
  if(musicTab==='library') S.music.push(item);
  else if(musicTab==='favMine') S.musicFavMine.push(item);
  else S.musicFavTheirs.push(item);
  save();renderMusicBody();toast('已添加');
}
function openMusic(id){
  if(!id) return;
  const all=[...S.music,...S.musicFavMine,...S.musicFavTheirs];
  const m=all.find(x=>x.id===id);
  if(m&&m.url) window.open(m.url,'_blank');
}
function delMusic(id){
  if(!confirm('删除这首音乐？')) return;
  if(musicTab==='library') S.music=S.music.filter(x=>x.id!==id);
  else if(musicTab==='favMine') S.musicFavMine=S.musicFavMine.filter(x=>x.id!==id);
  else S.musicFavTheirs=S.musicFavTheirs.filter(x=>x.id!==id);
  save();renderMusicBody();
}
function delMusicSelected(){
  if(!confirm(`删除选中的 ${musicSel.size} 首？`)) return;
  if(musicTab==='library') S.music=S.music.filter(x=>!musicSel.has(x.id));
  else if(musicTab==='favMine') S.musicFavMine=S.musicFavMine.filter(x=>!musicSel.has(x.id));
  else S.musicFavTheirs=S.musicFavTheirs.filter(x=>!musicSel.has(x.id));
  musicSel.clear();musicSelect=false;save();updateMusicActions();renderMusicBody();
}

/* ========== 子页面：提问 ========== */
let qTab='mine';
function subQuestions(){
  $('#subTitle').textContent='提问';
  $('#subActions').innerHTML=`<button class="back-icon" onclick="addQuestion()">${icon('plus',20)}</button>`;
  renderQuestionBody();
}
function renderQuestionBody(){
  const body=$('#subBody');body.style.padding='4px 16px 24px';
  const list=qTab==='mine'?S.questionsMine:S.questionsTheirs;
  body.innerHTML=`
    <div class="tabs">
      <button class="tab ${qTab==='mine'?'on':''}" onclick="setQTab('mine')">我的提问</button>
      <button class="tab ${qTab==='theirs'?'on':''}" onclick="setQTab('theirs')">TA 的提问</button>
    </div>
    ${list.length?list.map((q,i)=>`
      <div class="q-item">
        <div class="q-idx">${i+1}</div>
        <div class="q-text">${esc(q.text)}</div>
        <button class="mini-btn danger" onclick="delQuestion('${q.id}')">删</button>
      </div>`).join('')
      :'<div class="empty">还没有提问</div>'}
    <div class="tip">一次提问可以包含至少 1 个问题，数量不限。</div>`;
}
function setQTab(t){qTab=t;renderQuestionBody();}
async function addQuestion(){
  let count=0;
  while(true){
    const q=await ask(count===0?'添加问题（至少 1 个）':'继续添加（留空结束）','');
    if(q===null||!q.trim())break;
    if(qTab==='mine') S.questionsMine.push({id:uid(),text:q.trim()});
    else S.questionsTheirs.push({id:uid(),text:q.trim()});
    count++;
  }
  if(count){save();renderQuestionBody();toast(`已添加 ${count} 个`);}
}
function delQuestion(id){
  if(qTab==='mine') S.questionsMine=S.questionsMine.filter(x=>x.id!==id);
  else S.questionsTheirs=S.questionsTheirs.filter(x=>x.id!==id);
  save();renderQuestionBody();
}

/* ========== 子页面：喝水 ========== */
function subWater(){
  $('#subTitle').textContent='喝水';$('#subActions').innerHTML='';
  if(S.water.date!==todayStr()){S.water={count:0,date:todayStr()};save();}
  renderWaterBody();
}
function renderWaterBody(){
  const body=$('#subBody');body.style.padding='4px 16px 24px';
  const goal=8;
  const pct=Math.min(100,(S.water.count/goal)*100);
  body.innerHTML=`
    <div class="card" style="text-align:center;padding:22px 16px">
      <div style="font-size:14.5px;font-weight:600">${esc(activeChat().name)} 提醒你喝水</div>
      <div style="font-size:12px;color:var(--sub);margin-top:7px">每天 8 杯水，健康又美丽</div>
    </div>
    <div class="water-cup"><div class="water-fill" style="height:${pct}%"></div></div>
    <div style="text-align:center;font-size:26px;font-weight:800;margin-bottom:18px">
      ${S.water.count}<span style="font-size:13px;font-weight:400;color:var(--sub)">/ ${goal} 杯</span>
    </div>
    <button class="water-btn" onclick="drinkWater()">喝一杯</button>
    <button class="btn-line" style="width:100%;margin-top:12px" onclick="resetWater()">重置今日</button>
    <div class="tip">${S.water.count>=goal?'🎉 今天达标啦！':'继续加油～'}</div>`;
}
function drinkWater(){S.water.count++;save();renderWaterBody();if(S.water.count===8)toast('🎉 今天喝够了！');}
function resetWater(){S.water={count:0,date:todayStr()};save();renderWaterBody();}

/* ========== 教程 ========== */
const TUTORIAL=[
  {e:'👋',t:'欢迎来到梦角',d:'这是一个只属于你和 TA 的私人空间。所有回复都来自你添加的「字卡」。'},
  {e:'🗂️',t:'第一步：添加字卡',d:'点击第二页「设置」→「字卡」，可以在主字卡、颜文字、Emoji、表情库、语音里添加内容。'},
  {e:'💬',t:'开始聊天',d:'点击首页「聊天」图标，进入消息列表。发送消息后 TA 会随机回复你。长按消息可删除、收藏、复制、回复、编辑。'},
  {e:'🎧',t:'一起听歌',d:'TA 有时会邀请你一起听歌，点消息里的歌曲卡片即可打开音乐。'},
  {e:'🔒',t:'数据只在本地',d:'聊天记录、字卡、头像等全部保存在你本机浏览器中。'}
];
let tutIdx=0;
function showTutorial(){tutIdx=0;renderTut();$('#tutorial').classList.remove('hidden');}
function renderTut(){
  const t=TUTORIAL[tutIdx];
  $('#tutEmoji').textContent=t.e;
  $('#tutTitle').textContent=t.t;
  $('#tutText').textContent=t.d;
  $('#tutDots').innerHTML=TUTORIAL.map((_,i)=>`<i class="${i===tutIdx?'on':''}"></i>`).join('');
  $('#tutNext').textContent=tutIdx===TUTORIAL.length-1?'开始使用':'下一步';
}
function nextTut(){
  if(tutIdx<TUTORIAL.length-1){tutIdx++;renderTut();}
  else closeTutorial();
}
function closeTutorial(){$('#tutorial').classList.add('hidden');S.tutorialSeen=true;save();}

/* 网络 */
function checkNet(){$('#netBar').classList.toggle('on',!navigator.onLine);}
function retryNet(){if(navigator.onLine){checkNet();toast('网络已恢复');}else toast('仍然无法连接');}
window.addEventListener('online',()=>{checkNet();toast('网络已恢复');});
window.addEventListener('offline',checkNet);

/* 播放器 */
let playing=false;
function togglePlay(){
  if(!S.music.length){toast('还没有音乐');return;}
  playing=!playing;
  const ic=$('#playIcon');
  if(ic) ic.innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M7 4v16l13-8z"/>';
}
function prevTrack(){toast('上一首');}
function nextTrack(){toast('下一首');}

/* ========== 初始化 ========== */
function init(){
  applyTheme();
  renderMain();
  checkNet();
  applyChatBg();
  applyChatCss();

  const pager=$('#pager');
  pager.addEventListener('scroll',()=>{
    const idx=Math.round(pager.scrollLeft/pager.clientWidth);
    $$('#dots .dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
  },{passive:true});

  const chatInp=$('#chatInput');
  if(chatInp){
    chatInp.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendChat();}
    });
  }

  // TA 主动发消息
  setInterval(()=>{
    if(!S.settings.proactive) return;
    if(currentView!=='chat') return;
    const lib=S.cardLib.main?.cards||[];
    if(!lib.length) return;
    if(Math.random()>0.2) return;
    const c=activeChat();
    if(c.typing) return;
    const pick=pickFromCardLib();
    if(!pick) return;
    if(pick.type==='sticker') c.messages.push({id:uid(),from:'them',type:'sticker',src:pick.src,ts:Date.now()});
    else c.messages.push({id:uid(),from:'them',type:'text',text:pick.text,ts:Date.now()});
    save();renderChatMessages();playTap();
  },90000);

  // TA 主动来电
  setInterval(()=>{
    if(currentView==='chat'||currentView==='chatlist'||currentView==='main'){
      triggerIncomingCall();
    }
  },180000);

  // TA 主动邀请一起听歌（50% 概率）
  setInterval(()=>{
    if(currentView==='chat'||currentView==='chatlist'||currentView==='main'){
      triggerSongInvite();
    }
  },150000);

  // 访问朋友圈 & 发朋友圈
  setInterval(()=>{
    if(Math.random()<0.05){
      S.visitors.push({id:uid(),name:activeChat().name,avatar:activeChat().avatar,ts:Date.now()});
      if(S.visitors.length>100) S.visitors=S.visitors.slice(-100);
      save();
    }
    if(Math.random()<0.5){
      const lib=S.cardLib.main?.cards||[];
      const extras=[...(S.cardLib.kaomoji?.cards||[]),...(S.cardLib.emoji?.cards||[])];
      const all=[...lib,...extras];
      if(all.length){
        const c=all[Math.floor(Math.random()*all.length)];
        const m={
          id:uid(),author:activeChat().name,avatar:activeChat().avatar,
          text:c.text||'',images:[],likes:[],comments:[],ts:Date.now()
        };
        S.moments.push(m);save();
      }
    }
  },150000);

  if(!S.tutorialSeen) setTimeout(showTutorial,500);

  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>{
      if(window.innerWidth<520){
        document.getElementById('app').style.height=window.visualViewport.height+'px';
      }
    });
  }
}

window.addEventListener('beforeunload',saveNow);
init();
</script>
